kind = "web"
previewPath = "/"
title = "Case Management"
version = "1.0.0"
id = "artifacts/case-management"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20951

[services.development]
run = "pnpm --filter @workspace/case-management run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/case-management", "run", "build" ]
serve = "static"
publicDir = "artifacts/case-management/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20951"
BASE_PATH = "/"
